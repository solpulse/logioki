name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream desktop-file-utils gir1.2-adw-1 gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 gir1.2-gtk-4.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good python3-gi xauth xvfb
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.solpulse.Logioki.desktop
          appstreamcli validate --no-net data/io.github.solpulse.Logioki.metainfo.xml
      - name: Smoke-test GNOME interface
        run: xvfb-run -a env LOGIOKI_DESKTOP_STYLE=gnome python3 tests/ui_smoke.py
      - name: Smoke-test KDE interface
        run: xvfb-run -a env LOGIOKI_DESKTOP_STYLE=kde python3 tests/ui_smoke.py

  security-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Check formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy --strict models.py device_monitor.py desktop.py
      - name: Scan Python code for security issues
        run: >-
          python -m bandit --recursive . --exclude ./.git,./tests
          --severity-level medium --confidence-level medium

  native-kde-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install native KDE extra
        run: python -m pip install --disable-pip-version-check '.[kde]'
      - name: Smoke-test native Qt interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_kde_qt -v
