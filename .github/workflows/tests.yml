name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream desktop-file-utils libegl1 libpulse0 python3-pip
      - name: Install unified GUI
        run: python3 -m pip install --break-system-packages --disable-pip-version-check '.[gui]'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.solpulse.Logioki.desktop
          appstreamcli validate --no-net data/io.github.solpulse.Logioki.metainfo.xml
      - name: Smoke-test GNOME profile
        run: >-
          env QT_QPA_PLATFORM=offscreen LOGIOKI_DESKTOP_STYLE=gnome
          LOGIOKI_HIGH_CONTRAST=1 LOGIOKI_REDUCED_MOTION=1 UI_SMOKE_DARK=1
          UI_SMOKE_WIDTH=760 python3 tests/ui_smoke.py
      - name: Smoke-test KDE profile
        run: >-
          env QT_QPA_PLATFORM=offscreen LOGIOKI_DESKTOP_STYLE=kde
          UI_SMOKE_SCHEME=light python3 tests/ui_smoke.py
      - name: Validate QML sources
        run: pyside6-qmllint -I logioki_ui logioki_ui/qml/*.qml

  security-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Check formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy --strict models.py device_monitor.py desktop.py
      - name: Scan Python code for security issues
        run: >-
          python -m bandit --recursive . --exclude ./.git,./tests
          --severity-level medium --confidence-level medium

  packaged-qml-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1 libpulse0
      - name: Install unified GUI extra
        run: python -m pip install --disable-pip-version-check '.[gui]'
      - name: Smoke-test packaged QML boundary
        env:
          QT_QPA_PLATFORM: offscreen
          LOGIOKI_PACKAGED_SMOKE: "1"
          LOGIOKI_DESKTOP_STYLE: kde
          UI_SMOKE_SCHEME: light
        run: cd /tmp && python "$GITHUB_WORKSPACE/tests/ui_smoke.py"
