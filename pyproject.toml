[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logioki"
version = "0.1.0"
description = "Native Linux control panel for UVC webcams"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Logioki Contributors" }]
keywords = ["camera", "GTK", "KDE", "Linux", "UVC", "webcam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
]

[project.urls]
Homepage = "https://github.com/solpulse/logioki"
Issues = "https://github.com/solpulse/logioki/issues"
Source = "https://github.com/solpulse/logioki"

[project.scripts]
logioki = "logioki_cli:main"
logioki-kde = "kde_qt:main"

[project.optional-dependencies]
kde = ["PySide6>=6.7,<7"]

[tool.setuptools]
py-modules = [
  "device_monitor",
  "desktop",
  "controller",
  "gnome_view",
  "kde_view",
  "kde_qt",
  "logioki",
  "logioki_cli",
  "models",
  "preview",
  "service",
  "store",
  "v4l2ctl",
]
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.solpulse.Logioki.desktop"]
"share/metainfo" = ["data/io.github.solpulse.Logioki.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["data/io.github.solpulse.Logioki.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true
